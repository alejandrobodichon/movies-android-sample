name: 'Setup Project'
description: 'Setup JDK, Gradle, and generate config files'

inputs:
  tmdb-api-key:
    description: 'TMDB API Key'
    required: true
  google-services-json:
    description: 'Google Services JSON (base64)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Java JDK
      uses: actions/setup-java@v5.6.0
      with:
        java-version: 21
        distribution: "temurin"
        cache: gradle

    - name: Create local.properties
      shell: bash
      run: |
        echo "sdk.dir=${ANDROID_HOME}" >> local.properties
        echo "TMDB_API_KEY=${{ inputs.tmdb-api-key }}" >> local.properties

    - name: Create google-services.json
      shell: bash
      run: echo '${{ inputs.google-services-json }}' | base64 -d > app/google-services.json

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6