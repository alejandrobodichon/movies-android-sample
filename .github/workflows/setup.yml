name: 'Setup Project'
description: 'Setup JDK, Gradle, and generate config files'
runs:
  using: "composite"
  steps:
    - name: Setup Java JDK
      uses: actions/setup-java@v5.6.0
      with:
        java-version: 21
        distribution: "temurin"
        cache: gradle

    - name: Create local.properties
      shell: bash
      run: |
        echo "sdk.dir=${ANDROID_HOME}" >> local.properties
        echo "TMDB_API_KEY=${{ env.TMDB_API_KEY }}" >> local.properties

    - name: Create google-services.json
      shell: bash
      run: echo "${{ env.GOOGLE_SERVICES_JSON }}" > app/google-services.json

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6